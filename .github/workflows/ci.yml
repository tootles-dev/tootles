name: Rust (GitHub)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Match Forgejo's tested runtime, including mpv's tct frame-buffering option.
    container: node:22-trixie
    steps:
      - name: Install build and terminal-test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config procps python3 mpv ffmpeg
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11+ is required"'
          mpv --list-options | grep -- '--vo-tct-buffering'
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - name: Verify keyboard, links, and image viewer handoff
        run: python3 scripts/smoke-terminal.py
      - name: Verify Mastodon and Bluesky account switching
        run: python3 scripts/smoke-bluesky.py
      - name: Verify terminal playback and restoration
        run: python3 scripts/test-terminal-playback.py --binary target/release/tootles --expect-fixed
