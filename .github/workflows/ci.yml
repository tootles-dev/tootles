name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - name: Install video regression tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mpv ffmpeg
      - name: Verify terminal playback and restoration
        run: python3 scripts/test-terminal-playback.py --binary target/release/tootles --expect-fixed
